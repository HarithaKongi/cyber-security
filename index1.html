<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL PRIME | Quantum Threat Orchestrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-red: #ff3131; }
        body { font-family: 'Space Grotesk', sans-serif; background: #010208; overflow-x: hidden; }
        .glitch-font { font-family: 'Syncopate', sans-serif; text-transform: uppercase; }
        
        .hologram {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .hologram:hover { border-color: var(--neon-blue); transform: translateY(-5px) scale(1.01); box-shadow: 0 10px 50px rgba(0, 242, 255, 0.15); }
        #neural-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; filter: blur(1px); }
        .threat-alert { border-color: var(--neon-red) !important; animation: red-flicker 1.5s infinite; }
        @keyframes red-flicker { 
            0%, 100% { box-shadow: 0 0 10px rgba(255, 49, 49, 0.2); opacity: 1; }
            50% { box-shadow: 0 0 30px rgba(255, 49, 49, 0.6); opacity: 0.8; }
        }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
        .scanner { width: 100%; height: 2px; background: var(--neon-blue); position: absolute; z-index: 20; animation: scan 4s linear infinite; opacity: 0.3; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="text-white selection:bg-cyan-500/30">

    <canvas id="neural-canvas"></canvas>

    <div class="max-w-[1600px] mx-auto p-6 md:p-12 relative">
        <nav class="flex justify-between items-start mb-16">
            <div>
                <h1 class="text-6xl font-black italic glitch-font tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                    Sentinel Prime
                </h1>
                <div class="flex items-center gap-4 mt-4">
                    <span class="px-3 py-1 text-[10px] font-bold tracking-[0.3em] bg-cyan-500/10 border border-cyan-500/40 text-cyan-400 rounded-full">QUANTUM_SECURED</span>
                    <span id="uptime" class="text-[10px] text-slate-500 font-mono tracking-widest">UPTIME: 00:00:00</span>
                </div>
            </div>
            
            <div class="hologram p-6 rounded-3xl flex gap-12 text-center">
                <div><p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest mb-1">Global Load</p><p class="text-2xl font-bold">14.2<span class="text-xs text-cyan-400">PB/s</span></p></div>
                <div class="w-[1px] h-10 bg-white/10 mt-2"></div>
                <div><p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest mb-1">Active Nodes</p><p class="text-2xl font-bold" id="node-count">1,240,002</p></div>
            </div>
        </nav>

        <main class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-3 space-y-6">
                <div class="flex justify-between items-end px-2">
                    <h2 class="text-xs font-bold uppercase tracking-[0.4em] text-slate-400">Live Telemetry Matrix</h2>
                    <div id="status-indicator" class="flex items-center gap-2 text-[10px] text-cyan-400 font-bold">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> LISTENING_FOR_INGEST
                    </div>
                </div>

                <div id="event-feed" class="space-y-4 max-h-[700px] overflow-y-auto pr-4 custom-scroll pb-10">
                    <div class="hologram p-20 rounded-[3rem] text-center border-dashed border-white/5">
                        <p class="text-slate-500 italic text-sm">Initializing Neural Link to Firebase...</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                    <button onclick="injectThreat('S1')" class="hologram py-6 rounded-2xl group relative overflow-hidden active:scale-95">
                        <div class="scanner"></div>
                        <span class="relative z-30 font-bold uppercase text-xs tracking-widest group-hover:text-cyan-400 transition-colors">Adaptive Threat</span>
                    </button>
                    <button onclick="injectThreat('S3')" class="hologram py-6 rounded-2xl font-bold uppercase text-xs tracking-widest hover:border-purple-500/50 transition-all active:scale-95">
                        Friction Edge Case
                    </button>
                    <button onclick="injectThreat('S4')" class="hologram py-6 rounded-2xl font-bold uppercase text-xs tracking-widest hover:border-red-500 text-red-500 transition-all active:scale-95">
                        Systemic Collapse
                    </button>
                </div>
            </div>

            <div class="space-y-8">
                <div class="hologram p-8 rounded-[2.5rem] relative overflow-hidden">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Cognitive Metrics</h3>
                    <div class="space-y-8">
                        <div>
                            <p class="text-[11px] text-cyan-400 font-bold mb-1 italic">Project ID</p>
                            <p class="text-xl font-bold">cyber-de86e</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // 1. FIREBASE INITIALIZATION
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, limitToLast, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuPChw_Kz1v3gtF-Evry09eTr58n8Xjjs",
            authDomain: "cyber-de86e.firebaseapp.com",
            databaseURL: "https://cyber-de86e-default-rtdb.firebaseio.com",
            projectId: "cyber-de86e",
            storageBucket: "cyber-de86e.firebasestorage.app",
            messagingSenderId: "349164080766",
            appId: "1:349164080766:web:2de47f786cc04d7e80122f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const logsRef = ref(db, 'security_logs');

        // 2. LOGIC
        window.injectThreat = async (type) => {
            let data = { 
                ip_address: `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`, 
                risk_score: Math.random(),
                timestamp: Date.now()
            };
            if(type === 'S1') data.event_type = 'ADAPTIVE_ENTROPY_EVASION';
            if(type === 'S3') { data.event_type = 'USER_BEHAVIOR_FRICTION'; data.risk_score = 0.52; }
            if(type === 'S4') { data.event_type = 'SYSTEMIC_COLLAPSE'; data.risk_score = 0.98; data.ip_address = 'CLUSTER_X_ROOT'; }
            
            try {
                await push(logsRef, data);
            } catch (e) {
                console.error("Firebase Connection Error:", e);
            }
        }

        onChildAdded(query(logsRef, limitToLast(10)), (snapshot) => {
            renderEvent(snapshot.val());
        });

        function renderEvent(ev) {
            const container = document.getElementById('event-feed');
            if(container.innerText.includes("Initializing")) container.innerHTML = '';
            
            const isCollapse = ev.event_type === 'SYSTEMIC_COLLAPSE';
            const card = document.createElement('div');
            card.className = `hologram p-6 rounded-3xl flex justify-between items-center group ${isCollapse ? 'threat-alert' : ''}`;
            
            card.innerHTML = `
                <div class="flex items-center gap-8">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center bg-white/5 border border-white/10 text-2xl">
                        ${isCollapse ? '⚠️' : '💠'}
                    </div>
                    <div>
                        <p class="text-[9px] font-bold tracking-[0.4em] text-slate-500 uppercase mb-1">${ev.event_type.replace(/_/g, ' ')}</p>
                        <h4 class="text-xl font-bold text-white tracking-tight">${ev.ip_address}</h4>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-600 font-mono mb-1">RISK_SCORE</p>
                    <p class="text-lg font-bold ${(ev.risk_score > 0.6) ? 'text-red-500' : 'text-cyan-400'}">${(ev.risk_score * 100).toFixed(1)}%</p>
                </div>`;
            container.prepend(card);
            if(container.children.length > 10) container.removeChild(container.lastChild);
        }

        // --- BACKGROUND ENGINE ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            points = Array.from({length: 80}, () => ({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5
            }));
        }
        function drawNeural() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.1)'; ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
            points.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<points.length; j++) {
                    let d = Math.hypot(p.x-points[j].x, p.y-points[j].y);
                    if(d < 150) {
                        ctx.lineWidth = 1 - d/150;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(points[j].x, points[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawNeural);
        }

        // Uptime Clock
        let sec = 0;
        setInterval(() => {
            sec++;
            const h = Math.floor(sec/3600).toString().padStart(2,'0');
            const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
            const s = (sec%60).toString().padStart(2,'0');
            document.getElementById('uptime').innerText = `UPTIME: ${h}:${m}:${s}`;
        }, 1000);

        window.onresize = initCanvas;
        initCanvas();
        drawNeural();
    </script>
</body>
</html>
